
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú | Cantina La Emilia</title>
<style>
:root {
  --verde: #304719;
  --marron: #985015;
  --crema: #f5f0e4;
  --papel: #fffdf8;
  --texto: #26301e;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--crema);
  color: var(--texto);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 19px;
  line-height: 1.45;
}
header {
  text-align: center;
  padding: 22px 16px 14px;
}
.logo {
  display: block;
  width: min(78%, 360px);
  height: auto;
  margin: 0 auto 10px;
}
header p {
  margin: 6px 0;
  color: var(--verde);
  font-weight: bold;
  letter-spacing: 1px;
  font-size: 16px;
}
nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--verde);
  padding: 10px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
}
nav a {
  color: white;
  text-decoration: none;
  border: 1px solid #ffffff75;
  border-radius: 20px;
  padding: 9px 14px;
  font-size: 16px;
  font-weight: bold;
}
main {
  width: min(100%, 850px);
  margin: 0 auto;
  padding: 12px;
}
.categoria {
  background: var(--papel);
  border: 2px solid var(--verde);
  border-radius: 16px;
  margin: 12px 0 18px;
  padding: 22px 18px;
  box-shadow: 0 3px 10px #34240c12;
  scroll-margin-top: 75px;
}
.categoria:nth-child(even) { border-color: var(--marron); }
h2 {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--verde);
  font-size: clamp(27px, 6vw, 35px);
  line-height: 1.15;
  margin: 0 0 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d9d3c4;
}
.categoria:nth-child(even) h2 { color: var(--marron); }
h3 {
  font-size: 21px;
  color: var(--marron);
  margin: 20px 0 6px;
}
.item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed #d7d0c1;
  font-size: 20px;
}
.nombre { flex: 1; }
.precio {
  min-width: 100px;
  text-align: right;
  font-weight: bold;
  color: var(--marron);
  white-space: nowrap;
}
.nota {
  font-size: 16px;
  color: #5b5a4c;
  margin: 14px 0 0;
}
footer {
  text-align: center;
  background: var(--verde);
  color: white;
  padding: 20px 12px;
  margin-top: 20px;
  font-size: 16px;
}
.logo-on {
  display: block;
  width: 75px;
  max-width: 25%;
  height: auto;
  margin: 18px auto 8px;
}
@media (min-width: 700px) {
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }
  .categoria { margin: 0 0 4px; padding: 22px; }
  .categoria.ancha { grid-column: 1 / -1; }
  .item { font-size: 18px; }
}
@media (max-width: 380px) {
  .categoria { padding: 17px 14px; }
  .item { font-size: 18px; }
  .precio { min-width: 80px; }
}
</style>
</head>

<header>

function crearItem(nombre) {
  const valor = (precios[nombre] || "").trim();
  const importe = valor
    ? `<span class="precio">$ ${valor}</span>`
    : `<span class="precio"></span>`;

  return `<div class="item">
    <span class="nombre">${nombre}</span>${importe}
  </div>`;
}

function crearCategoria(cat) {
  let contenido = "";

  if (cat.items) {
    contenido += cat.items.map(crearItem).join("");
  }

  if (cat.grupos) {
    contenido += cat.grupos.map(grupo =>
      `<h3>${grupo[0]}</h3>${grupo[1].map(crearItem).join("")}`
    ).join("");
  }

  if (cat.nota) {
    contenido += `<p class="nota">${cat.nota}</p>`;
  }

  const clase = cat.id === "bebidas" ? "categoria ancha" : "categoria";

  return `<section class="${clase}" id="${cat.id}">
    <h2>${cat.titulo}</h2>${contenido}
  </section>`;
}
