<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MANJARES | By Manjares Emilianos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
        }

        .contenedor {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 35px 22px 25px;
        }

        /* LOGO PRINCIPAL */

        .logo-manjares {
            display: block;
            width: 100%;
            max-width: 430px;
            margin: 0 auto 28px;
        }

        /* PRESENTACIÓN */

        .bienvenida {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 10px;
        }

        .frase {
            text-align: center;
            color: #777777;
            font-size: 13px;
            letter-spacing: 1.5px;
            margin-top: 10px;
        }

        .linea {
            width: 55px;
            height: 2px;
            background: #111111;
            margin: 24px auto 30px;
        }

        /* BOTONES */

        .botones {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .boton {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 58px;
            padding: 15px 20px;

            background: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 12px;

            color: #111111;
            text-decoration: none;

            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;

            transition: all 0.25s ease;
        }

        .boton:hover {
            background: #111111;
            color: #ffffff;
            border-color: #111111;
            transform: translateY(-2px);
        }

        .icono {
            position: absolute;
            left: 20px;
            font-size: 19px;
        }

        /* SEPARADOR */

        .separador {
            width: 100%;
            height: 1px;
            background: #eeeeee;
            margin: 38px 0 28px;
        }

        /* PIE */

        .pie-texto {
            text-align: center;
            color: #999999;
            font-size: 11px;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .logo-on {
            display: block;
            width: 95px;
            max-width: 30%;
            margin: auto;
        }

        .copyright {
            text-align: center;
            color: #b0b0b0;
            font-size: 10px;
            margin-top: 12px;
        }

        /* CELULAR */

        @media (max-width: 400px) {

            .contenedor {
                padding: 25px 18px 20px;
            }

            .bienvenida {
                font-size: 15px;
            }

            .frase {
                font-size: 12px;
            }

            .boton {
                min-height: 55px;
                font-size: 14px;
            }

        }
    </style>
</head>

<body>

    <div class="contenedor">

        </div>

        <div class="separador"></div>

        </div>

        <img

            class="logo-on"
        >

        <div class="copyright">

        </div>

    </div>

</body>
</html>
