<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MANJARES | By Manjares Emilianos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
        }

        .contenedor {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 35px 22px 25px;
        }

        /* LOGO PRINCIPAL */

        .logo-manjares {
            display: block;
            width: 100%;
            max-width: 430px;
            margin: 0 auto 28px;
        }

        /* PRESENTACIÓN */

        .bienvenida {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 10px;
        }

        .frase {
            text-align: center;
            color: #777777;
            font-size: 13px;
            letter-spacing: 1.5px;
            margin-top: 10px;
        }

        .linea {
            width: 55px;
            height: 2px;
            background: #111111;
            margin: 24px auto 30px;
        }

        /* BOTONES */

        .botones {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .boton {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 58px;
            padding: 15px 20px;

            background: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 12px;

            color: #111111;
            text-decoration: none;
            font-family: inherit;
            cursor: pointer;

            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;

            transition: all 0.25s ease;
        }

        .boton:hover {
            background: #111111;
            color: #ffffff;
            border-color: #111111;
            transform: translateY(-2px);
        }

        /* MEDIOS DE PAGO */

        .medios-pago {
            margin-top: 18px;
            padding: 20px;
            border: 1px solid #d8d8d8;
            border-radius: 12px;
            background: #fafafa;
            text-align: center;
        }

        .medios-pago[hidden] { display: none; }

        .medios-pago h2 {
            margin-bottom: 14px;
            font-size: 15px;
            letter-spacing: 1.5px;
        }

        .titular { color: #666666; font-size: 13px; margin-bottom: 6px; }
        .alias { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }

        .copiar-alias {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 14px;
            padding: 12px 16px;
            border: 1px solid #111111;
            border-radius: 10px;
            background: #111111;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .copiar-alias:hover { background: #ffffff; color: #111111; }
        .estado-copia { min-height: 16px; margin-top: 9px; color: #555555; font-size: 12px; }

        .icono {
            position: absolute;
            left: 20px;
            font-size: 19px;
        }

        /* SEPARADOR */

        .separador {
            width: 100%;
            height: 1px;
            background: #eeeeee;
            margin: 38px 0 28px;
        }

        /* PIE */

        .pie-texto {
            text-align: center;
            color: #999999;
            font-size: 11px;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .logo-on {
            display: block;
            width: 95px;
            max-width: 30%;
            margin: auto;
        }

        .copyright {
            text-align: center;
            color: #b0b0b0;
            font-size: 10px;
            margin-top: 12px;
        }

        /* CELULAR */

        @media (max-width: 400px) {

            .contenedor {
                padding: 25px 18px 20px;
            }

            .bienvenida {
                font-size: 15px;
            }

            .frase {
                font-size: 12px;
            }

            .boton {
                min-height: 55px;
                font-size: 14px;
            }

        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- LOGO MANJARES -->

        <img
            src="MANJARES.png"
            alt="MANJARES - By Manjares Emilianos"
            class="logo-manjares"
        >


        <!-- PRESENTACIÓN -->

        <div class="bienvenida">
            BIENVENIDOS
        </div>

        <div class="frase">
            SABORES PARA DISFRUTAR
        </div>

        <div class="linea"></div>


        <!-- BOTONES -->

        <div class="botones">

            <a href="menu.html" class="boton">
                <span class="icono">🍽</span>
                Ver menú
            </a>

            <a href="https://www.instagram.com/cantinalaemilia_bymanjares" class="boton">
                <span class="icono">◎</span>
                Instagram
            </a>

            <a href="https://wa.me/+5493364570013" class="boton">
                <span class="icono">◉</span>
                WhatsApp
            </a>

            <a href="https://maps.app.goo.gl/L8LSXvyCG2y7V8Ka7" class="boton">
                <span class="icono">⌖</span>
                Cómo llegar
            </a>

            <button type="button" class="boton" id="abrir-medios-pago" aria-expanded="false" aria-controls="medios-pago">
                <span class="icono">▣</span>
                Medios de pago
            </button>

        </div>

        <section class="medios-pago" id="medios-pago" aria-labelledby="titulo-medios-pago" hidden>
            <h2 id="titulo-medios-pago">MEDIOS DE PAGO</h2>
            <p class="titular">Titular: Andrea Dutrue</p>
            <p class="alias" id="alias-pago">Cantina.manjares</p>
            <button class="copiar-alias" id="copiar-alias" type="button">Copiar alias</button>
            <p class="estado-copia" id="estado-copia" role="status" aria-live="polite"></p>
        </section>


        <!-- PIE -->

        <div class="separador"></div>

        <div class="pie-texto">
            UNA EXPERIENCIA PARA DISFRUTAR
        </div>

        <img
            src="logo_on_transparente.png"
            alt="ON Soporte Informático"
            class="logo-on"
        >

        <div class="copyright">
            Soluciones digitales · ON Soporte Informático
        </div>

    </div>

<script>
    const botonMediosPago = document.getElementById("abrir-medios-pago");
    const panelMediosPago = document.getElementById("medios-pago");
    const botonCopiar = document.getElementById("copiar-alias");
    const textoAlias = document.getElementById("alias-pago").textContent.trim();
    const estadoCopia = document.getElementById("estado-copia");

    botonMediosPago.addEventListener("click", () => {
        const abierto = botonMediosPago.getAttribute("aria-expanded") === "true";
        botonMediosPago.setAttribute("aria-expanded", String(!abierto));
        panelMediosPago.hidden = abierto;
        if (!abierto) {
            panelMediosPago.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
    });

    botonCopiar.addEventListener("click", async () => {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(textoAlias);
            } else {
                const campo = document.createElement("textarea");
                campo.value = textoAlias;
                campo.setAttribute("readonly", "");
                campo.style.position = "fixed";
                campo.style.opacity = "0";
                document.body.appendChild(campo);
                campo.select();
                const copiado = document.execCommand("copy");
                campo.remove();
                if (!copiado) throw new Error("No se pudo copiar");
            }
            estadoCopia.textContent = "Alias copiado";
            botonCopiar.textContent = "¡Alias copiado!";
        } catch (error) {
            estadoCopia.textContent = "No se pudo copiar automáticamente. Mantené presionado el alias para copiarlo.";
        }
    });
</script>
</body>
</html>
