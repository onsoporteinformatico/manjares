
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANJARES | By Manjares Emilianos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--verde:#304719;--marron:#985015;--crema:#f5f0e4;--papel:#fffdf8}
body{font-family:Arial,Helvetica,sans-serif;background:var(--crema);color:var(--verde);min-height:100vh;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(245,240,228,.68),rgba(245,240,228,.78)),url("FONDO1.jpeg") center top/80% auto no-repeat}
.contenedor{width:100%;max-width:480px;margin:auto;padding:35px 22px 25px}
.logo-manjares{display:block;width:100%;max-width:440px;height:auto;margin:0 auto 30px;filter:drop-shadow(0 2px 3px rgba(48,71,25,.10))}
.bienvenida{text-align:center;font-size:17px;font-weight:600;letter-spacing:3px;margin-top:10px}
.frase{text-align:center;color:var(--marron);font-size:13px;letter-spacing:1.5px;margin-top:10px}
.linea{width:55px;height:2px;background:var(--verde);margin:24px auto 30px}
.botones{display:flex;flex-direction:column;gap:13px}
.boton{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:15px 20px;background:rgba(255,253,248,.92);border:1px solid var(--verde);border-radius:12px;color:var(--verde);text-decoration:none;font-family:inherit;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.5px;transition:all .25s ease}
.boton:hover{background:var(--verde);color:var(--papel);border-color:var(--verde);transform:translateY(-2px)}
.medios-pago{margin-top:18px;padding:20px;border:1px solid var(--verde);border-radius:12px;background:rgba(255,253,248,.96);text-align:center}
.medios-pago[hidden]{display:none}
.medios-pago h2{margin-bottom:14px;font-size:15px;letter-spacing:1.5px}
.titular{color:#666;font-size:13px;margin-bottom:6px}
.alias{font-size:17px;font-weight:700;letter-spacing:.3px}
.copiar-alias{display:block;width:100%;min-height:48px;margin-top:14px;padding:12px 16px;border:1px solid var(--verde);border-radius:10px;background:var(--verde);color:var(--papel);font-size:14px;font-weight:700;cursor:pointer;transition:background .2s ease,color .2s ease}
.copiar-alias:hover{background:var(--papel);color:var(--verde)}
.estado-copia{min-height:16px;margin-top:9px;color:#555;font-size:12px}
.icono{position:absolute;left:20px;font-size:19px}
.separador{width:100%;height:1px;background:#e5ddcc;margin:38px 0 28px}
.pie-texto{text-align:center;color:var(--marron);font-size:11px;letter-spacing:1.5px;margin-bottom:18px}
.logo-on{display:block;width:112px;max-width:36%;height:auto;margin:auto;filter:drop-shadow(0 2px 3px rgba(48,71,25,.12))}
.copyright{text-align:center;color:var(--verde);font-size:10px;margin-top:12px}
@media(max-width:400px){.contenedor{padding:25px 18px 20px}.bienvenida{font-size:15px}.frase{font-size:12px}.boton{min-height:55px;font-size:14px}}
</style>
</head>
<body>
<div class="contenedor">
    <img src="MANJARES.svg" alt="MANJARES - By Manjares Emilianos" class="logo-manjares">
    <div class="bienvenida">BIENVENIDOS</div>
    <div class="frase">SABORES PARA DISFRUTAR</div>
    <div class="linea"></div>

    <div class="botones">
        <a href="menu.html" class="boton"><span class="icono">🍽</span>Ver Menú</a>
        <a href="https://www.instagram.com/cantinalaemilia_bymanjares" class="boton"><span class="icono">◎</span>Instagram</a>
        <a href="https://wa.me/+5493364570013" class="boton"><span class="icono">◉</span>WhatsApp</a>
        <a href="https://maps.app.goo.gl/L8LSXvyCG2y7V8Ka7" class="boton"><span class="icono">⌖</span>Cómo Llegar</a>
        <button type="button" class="boton" id="abrir-medios-pago" aria-expanded="false" aria-controls="medios-pago"><span class="icono">▣</span>Medios de Pago</button>
    </div>

    <section class="medios-pago" id="medios-pago" aria-labelledby="titulo-medios-pago" hidden>
        <h2 id="titulo-medios-pago">Transferencia (Enviar Comprobante)</h2>
        <p class="titular">Titular: Andrea Dutruel</p>
        <p class="alias" id="alias-pago">cantina.manjares</p>
        <button class="copiar-alias" id="copiar-alias" type="button">Copiar Alias</button>
        <p class="estado-copia" id="estado-copia" role="status" aria-live="polite"></p>
    </section>

    <div class="separador"></div>
    <div class="pie-texto">UNA EXPERIENCIA PARA DISFRUTAR</div>
    <img src="LOGO_ON_verde_simbolo_texto_negro.svg" alt="ON Soporte Informático" class="logo-on">
    <div class="copyright">Soluciones digitales · ON Soporte Informático</div>
</div>

<script>
const botonMediosPago=document.getElementById("abrir-medios-pago");
const panelMediosPago=document.getElementById("medios-pago");
const botonCopiar=document.getElementById("copiar-alias");
const textoAlias=document.getElementById("alias-pago").textContent.trim();
const estadoCopia=document.getElementById("estado-copia");

botonMediosPago.addEventListener("click",()=>{
    const abierto=botonMediosPago.getAttribute("aria-expanded")==="true";
    botonMediosPago.setAttribute("aria-expanded",String(!abierto));
    panelMediosPago.hidden=abierto;
    if(!abierto)panelMediosPago.scrollIntoView({behavior:"smooth",block:"nearest"});
});

botonCopiar.addEventListener("click",async()=>{
    try{
        if(navigator.clipboard&&window.isSecureContext){
            await navigator.clipboard.writeText(textoAlias);
        }else{
            const campo=document.createElement("textarea");
            campo.value=textoAlias;
            campo.setAttribute("readonly","");
            campo.style.position="fixed";
            campo.style.opacity="0";
            document.body.appendChild(campo);
            campo.select();
            const copiado=document.execCommand("copy");
            campo.remove();
            if(!copiado)throw new Error("No se pudo copiar");
        }
        estadoCopia.textContent="Alias copiado";
        botonCopiar.textContent="¡Alias copiado!";
    }catch(error){
        estadoCopia.textContent="No se pudo copiar automáticamente. Mantené presionado el alias para copiarlo.";
    }
});
</script>
</body>
</html>
